<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 3D 地球演示</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #040b17; color: #e8f2ff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #info { position: absolute; left: 24px; top: 24px; max-width: 320px; padding: 18px 20px; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; background: rgba(4, 10, 23, 0.78); backdrop-filter: blur(16px); }
      #info h1 { font-size: 1.3rem; margin-bottom: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: #8ab7ff; }
      #info p { line-height: 1.7; color: #d8e4ff; }
      #info .status { margin-top: 0.75rem; font-size: 0.95rem; color: #c4d1ff; }
      #info .tip { margin-top: 0.8rem; font-size: 0.82rem; color: #9ab6ff; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="info">
        <h1>Three.js 3D 地球</h1>
        <p>自动旋转、鼠标拖拽、浏览器定位，并在地表打点。定位失败时使用指定默认坐标。</p>
        <div class="status" id="status">定位中...</div>
        <div class="tip">拖拽旋转，滚轮缩放。</div>
      </div>
      <canvas id="earthCanvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.166.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      const DEFAULT_LOCATION = { lat: 39.9042, lon: 116.4074 }
      const statusEl = document.getElementById('status')
      const canvas = document.getElementById('earthCanvas')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true })
      renderer.setPixelRatio(window.devicePixelRatio ? Math.min(window.devicePixelRatio, 2) : 1)
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.outputEncoding = THREE.sRGBEncoding

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#040b17')

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100)
      camera.position.set(0, 0.4, 5.8)

      const controls = new THREE.OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.autoRotate = true
      controls.autoRotateSpeed = 0.35
      controls.minDistance = 3
      controls.maxDistance = 12

      const ambientLight = new THREE.AmbientLight('#ffffff', 0.36)
      scene.add(ambientLight)
      const mainLight = new THREE.DirectionalLight('#ffffff', 1.2)
      mainLight.position.set(5, 3, 5)
      scene.add(mainLight)
      const fillLight = new THREE.PointLight('#76c8ff', 0.6, 0, 2)
      fillLight.position.set(-4, -2, 3)
      scene.add(fillLight)

      const earthGeometry = new THREE.SphereGeometry(1.6, 128, 128)
      const earthMaterial = new THREE.MeshPhongMaterial({
        map: createEarthTexture(),
        shininess: 10,
      })
      const earth = new THREE.Mesh(earthGeometry, earthMaterial)
      scene.add(earth)

      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.64, 128, 128),
        new THREE.MeshPhongMaterial({ color: '#8fb7ff', transparent: true, opacity: 0.12, shininess: 0 })
      )
      scene.add(atmosphere)

      const markerMaterial = new THREE.MeshStandardMaterial({ color: '#ff7a5a', emissive: '#ff8d76', emissiveIntensity: 1 })
      const marker = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 18), markerMaterial)
      scene.add(marker)

      function createEarthTexture() {
        const size = 2048
        const canvas = document.createElement('canvas')
        canvas.width = size
        canvas.height = size
        const ctx = canvas.getContext('2d')

        const gradient = ctx.createRadialGradient(size * 0.45, size * 0.35, size * 0.15, size * 0.5, size * 0.5, size * 0.9)
        gradient.addColorStop(0, '#296891')
        gradient.addColorStop(1, '#081426')
        ctx.fillStyle = gradient
        ctx.fillRect(0, 0, size, size)

        ctx.fillStyle = '#2d6e5d'
        ctx.beginPath()
        ctx.ellipse(size * 0.32, size * 0.41, size * 0.15, size * 0.11, 0, 0, Math.PI * 2)
        ctx.ellipse(size * 0.455, size * 0.26, size * 0.14, size * 0.08, 0, 0, Math.PI * 2)
        ctx.ellipse(size * 0.62, size * 0.17, size * 0.13, size * 0.09, 0.3, 0, Math.PI * 2)
        ctx.ellipse(size * 0.82, size * 0.56, size * 0.15, size * 0.12, -0.4, 0, Math.PI * 2)
        ctx.ellipse(size * 0.17, size * 0.55, size * 0.11, size * 0.08, 0, 0, Math.PI * 2)
        ctx.ellipse(size * 0.08, size * 0.22, size * 0.07, size * 0.05, 0, 0, Math.PI * 2)
        ctx.fill()

        ctx.fillStyle = '#4fb38d'
        ctx.beginPath()
        ctx.ellipse(size * 0.57, size * 0.52, size * 0.13, size * 0.08, 0.1, 0, Math.PI * 2)
        ctx.ellipse(size * 0.43, size * 0.68, size * 0.15, size * 0.1, -0.2, 0, Math.PI * 2)
        ctx.fill()

        ctx.fillStyle = '#6fd2a9'
        ctx.fillRect(size * 0.7, size * 0.12, size * 0.08, size * 0.13)
        ctx.fillRect(size * 0.23, size * 0.7, size * 0.05, size * 0.08)

        return new THREE.CanvasTexture(canvas)
      }

      function latLonToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180)
        const theta = (lon + 180) * (Math.PI / 180)
        const x = -(radius * Math.sin(phi) * Math.cos(theta))
        const z = radius * Math.sin(phi) * Math.sin(theta)
        const y = radius * Math.cos(phi)
        return new THREE.Vector3(x, y, z)
      }

      function setMarker(lat, lon) {
        const pos = latLonToVector3(lat, lon, 1.62)
        marker.position.copy(pos)
      }

      function handleGeoSuccess(position) {
        const { latitude, longitude } = position.coords
        statusEl.textContent = `定位成功：${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°`
        setMarker(latitude, longitude)
      }

      function handleGeoError() {
        statusEl.textContent = '定位失败，使用默认坐标。'
        setMarker(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon)
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(handleGeoSuccess, handleGeoError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000,
        })
      } else {
        statusEl.textContent = '浏览器不支持定位，使用默认坐标。'
        setMarker(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon)
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      function animate() {
        requestAnimationFrame(animate)
        earth.rotation.y += 0.0018
        controls.update()
        renderer.render(scene, camera)
      }

      animate()
    </script>
  </body>
</html>
