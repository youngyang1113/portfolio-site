name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 关键：明确赋予写入权限，解决 exit code 128 问题
permissions:
  contents: write       # 允许推送代码到仓库
  pages: write          # 允许部署 Pages
  id-token: write       # 官方 Pages 部署必需

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 升级到长期支持版本，规避 Node.js 20 弃用警告
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # 官方标准 Pages 部署流程，无需手动操作 gh-pages 分支
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # 替换为你的构建输出目录（如 Vite 是 dist，Next.js 是 out）

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4